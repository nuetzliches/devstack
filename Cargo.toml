[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are standalone experiments with their own manifests (plan §7).
exclude = ["spikes"]

[workspace.package]
version = "0.26.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuetzliches/devstack"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
tower = { version = "0.5", features = ["util"] }
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
regex = "1"
ignore = "0.4.33"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
include_dir = "0.7"
# The hub's secrets of upstream MCP servers in the OS keychain (ADR-0069).
keyring = "4"
junction = { version = "2", default-features = false }
jiff = "0.2"
libc = "0.2"
# Mach host and time calls on macOS that libc marks deprecated (ADR-0054).
mach2 = "0.7"
# The tray's status item on macOS (ADR-0060), linked on macOS only.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSData",
    "NSDate",
    "NSGeometry",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSTimer",
] }
notify = "8"
rand = "0.10"
raw-window-handle = "0.6"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A UDP socket's send buffer: macOS refuses a datagram larger than it,
# 9 KiB by default (ADR-0056).
socket2 = "0.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
# The platform verifier: TLS to GitHub (update, release check) trusts the
# system's certificate store, so a TLS-inspecting proxy works as it does for
# the installers.
ureq = { version = "3", features = ["platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls-pki-types = "1"
time = "0.3"
x509-parser = "0.18"
sha2 = "0.11"
# PKCE for the hub's OAuth login of MCP upstreams (ADR-0069).
base64 = "0.22"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
# WinRT toasts (ADR-0045); windows-sys has no WinRT.
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
# Desktop notifications on Linux over the session bus, pure Rust (ADR-0045).
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

devstack-config = { path = "crates/devstack-config" }
devstack-proc = { path = "crates/devstack-proc" }
devstack-desktop = { path = "crates/devstack-desktop" }
devstack-compose = { path = "crates/devstack-compose" }
devstack-env = { path = "crates/devstack-env" }
devstack-build = { path = "crates/devstack-build" }
devstack-daemon = { path = "crates/devstack-daemon" }
devstack-node = { path = "crates/devstack-node" }
devstack-hub = { path = "crates/devstack-hub" }
devstack-skills = { path = "crates/devstack-skills" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
