# Fixture stack for devstack's own integration tests (plan §10). Grows with
# the implementation; today it covers the infra plane and ADR-0014.
version = 1

[stack]
name = "fixture"

# A lane on another machine of the pool runs in the .NET SDK image (ADR-0028).
[lanes]
image = "mcr.microsoft.com/dotnet/sdk:10.0"

[compose.app]
project   = "devstack-fixture"
files     = ["deploy/compose.yml", "dev/compose.dev.yml"]
env_files = ["dev/.env.defaults", "dev/.env"]
services  = ["db", "cache"]

[services.api]
compose       = { group = "app", service = "api" }
rewrite_hosts = ["db", "cache"]
watch         = ["src/Api/**"]
build         = "dotnet build src/Api/Api.csproj -c Debug -nologo -v q"
output        = "src/Api/bin/Debug/net10.0"
run           = "dotnet {artifact}/Api.dll"   # same command line on every platform
port          = 5080
health        = { http = "/health", timeout = "60s" }

[services.api.env]
ASPNETCORE_URLS     = "http://127.0.0.1:{port}"
Telemetry__Endpoint = "http://127.0.0.1:4317"

[services.api.workers]
env = { Jobs__Enabled = "{is_main}" }

[commands.ping]
description = "Call the API's health endpoint"
requires    = ["api"]
steps       = [{ http = "GET {service.api.url}/health" }]

[commands.reset]
description = "Stop the API, run a step, start it again (shape of a database reset)"
confirm     = "This restarts the API. Continue?"
steps       = [{ stop = "api" }, { exec = "git --version" }, { start = "api" }]

[groups.app]
label   = "Application"
members = ["api", "compose.app.db", "compose.app.cache", "command.ping", "command.reset"]
