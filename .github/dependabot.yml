# Updates for the pinned actions, the Rust dependencies and the dashboard's
# npm packages: one pull request per ecosystem and week for minor and patch
# versions (actions: majors too), one per major version otherwise. Security updates come as they appear.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Actions change rarely in a way that needs work here: majors too.
      actions:
        update-types: [major, minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
