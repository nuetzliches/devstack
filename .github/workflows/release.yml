name: release

# A tag v<version> builds devstack for Windows and Linux and publishes a GitHub
# release with the archives, SHA256SUMS and the install scripts, and a build
# provenance attestation for each of them (`gh attestation verify <file>
# --repo nuetzliches/devstack`). Asset names carry no version, so
# ".../releases/latest/download/<asset>" stays stable.
#
# workflow_dispatch, the schedule and pull requests that change the release
# (this file, the installers) build the same archives without publishing (dry
# run). On main they also keep the release build cache warm: a tag run can
# read caches of main but not of another tag, and GitHub drops a cache unused
# for 7 days, hence twice a week.
#
# After the release, the Windows build goes to winget: job `winget` submits
# the manifests of packaging/winget/ as a pull request to
# microsoft/winget-pkgs (a dry run only renders and checks them).
#
# Actions are pinned by commit SHA (the comment names the release);
# Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'install.ps1'
      - 'install.sh'
      - 'packaging/winget/**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1,4'

permissions:
  contents: read

jobs:
  ui:
    # The dashboard is the same for every target: build it once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: dashboard
        working-directory: ui
        run: npm ci && npm run build
      # What ships has no known advisory (a warning in ci, required here).
      - name: npm audit
        working-directory: ui
        run: npm audit --omit=dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist

  advisories:
    # No dependency with a known advisory goes into a release (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  build:
    needs: ui
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: devstack-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl   # static: runs on any glibc
            archive: devstack-x86_64-unknown-linux-musl.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          # Only main writes the cache; tag runs read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: musl tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: tag matches the crate and dashboard versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "v$crate" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml version $crate"; exit 1; }
          ui=$(grep -m1 '"version":' ui/package.json | cut -d'"' -f4)
          [ "v$ui" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != ui/package.json version $ui"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: build
        run: cargo build --release --locked -p devstack --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          mkdir -p dist
          if [ "${{ matrix.os }}" = windows-latest ]; then
            7z a -tzip "dist/${{ matrix.archive }}" "./$dir/devstack.exe" README.md
          else
            tar -czf "dist/${{ matrix.archive }}" -C "$dir" devstack -C "$GITHUB_WORKSPACE" README.md
          fi
          "$dir/devstack${{ matrix.os == 'windows-latest' && '.exe' || '' }}" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive }}

  publish:
    needs: [build, advisories]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed attestation per file (Sigstore, OIDC).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only what reached main (through a pull request and its checks) is
      # released: a tag on any other commit stops here.
      - name: the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} ($GITHUB_SHA) is not on main"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: x86_64-*
          merge-multiple: true
      - name: checksums and install scripts
        run: |
          cp install.ps1 install.sh dist/
          (cd dist && sha256sum devstack-* > SHA256SUMS && cat SHA256SUMS)
      - name: build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/devstack-*
            dist/SHA256SUMS
            dist/install.ps1
            dist/install.sh
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        # --verify-tag: only a tag that exists in the repository is released.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "devstack ${GITHUB_REF_NAME#v}" --generate-notes

  winget:
    # The manifests of packaging/winget/ with this release's version and the
    # checksum of the archive just built, checked, and on a tag submitted to
    # microsoft/winget-pkgs by wingetcreate (Microsoft, MIT; pinned by
    # version and checksum). Its review takes days; `winget upgrade` offers
    # the release once it is merged. The pull request comes from the fork of
    # winget-pkgs of the account whose token is the secret WINGET_TOKEN (a
    # classic token with `public_repo`); without the secret the job says so
    # and ends.
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: windows-latest
    env:
      WINGETCREATE_VERSION: 1.12.13.0
      WINGETCREATE_SHA256: 24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: x86_64-pc-windows-msvc
          path: dist
      - name: manifests
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value }
          $sha = (Get-FileHash dist/devstack-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $out = "winget/$version"
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($f in Get-ChildItem packaging/winget -Filter *.yaml) {
            $text = [IO.File]::ReadAllText($f.FullName) -replace '\{\{version\}\}', $version -replace '\{\{sha256\}\}', $sha -replace '\{\{date\}\}', $date
            if ($text -match '\{\{') { throw "$($f.Name): a placeholder is left" }
            [IO.File]::WriteAllText((Join-Path $out $f.Name), $text, [Text.UTF8Encoding]::new($false))
          }
          # The archive holds what the manifest names.
          Expand-Archive dist/devstack-x86_64-pc-windows-msvc.zip -DestinationPath unpacked
          if (-not (Test-Path unpacked/devstack.exe)) { throw 'devstack.exe is not at the root of the archive' }
          "MANIFESTS=$out" >> $env:GITHUB_ENV
          Get-Content "$out/nuetzliches.devstack.installer.yaml"
      - name: validate
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            "winget $(winget --version)"
            # An older winget on the runner warns about a newer schema in the
            # header comment, and exits non-zero for that too: only a failed
            # validation fails the job.
            $out = winget validate --manifest $env:MANIFESTS --disable-interactivity 2>&1 | Out-String
            $out
            if ($LASTEXITCODE -ne 0 -and $out -notmatch 'succeeded with warnings') { exit 1 }
            exit 0 # the step would end with winget's exit code otherwise
          } else {
            "::notice::no winget on this runner; wingetcreate checks the manifests when it submits them"
          }
      - name: submit
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ($env:HAS_TOKEN -ne 'true') { "::warning::no WINGET_TOKEN: not submitted to winget"; exit 0 }
          Invoke-WebRequest "https://github.com/microsoft/winget-create/releases/download/v$env:WINGETCREATE_VERSION/wingetcreate.exe" -OutFile wingetcreate.exe
          $hash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($hash -ne $env:WINGETCREATE_SHA256) { throw "wingetcreate.exe: checksum $hash, expected $env:WINGETCREATE_SHA256" }
          ./wingetcreate.exe submit --no-open --prtitle "New version: nuetzliches.devstack version $($env:GITHUB_REF_NAME.Substring(1))" $env:MANIFESTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
