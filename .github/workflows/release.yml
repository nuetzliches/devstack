name: release

# A tag v<version> builds devstack for Windows and Linux and publishes a GitHub
# release with the archives, SHA256SUMS and the install scripts. Asset names
# carry no version, so ".../releases/latest/download/<asset>" stays stable.
#
# workflow_dispatch and the schedule build the same archives without publishing
# (dry run). On main they also keep the release build cache warm: a tag run can
# read caches of main but not of another tag, and GitHub drops a cache unused
# for 7 days, hence twice a week.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1,4'

permissions:
  contents: read

jobs:
  ui:
    # The dashboard is the same for every target: build it once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: dashboard
        working-directory: ui
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  build:
    needs: ui
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: devstack-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl   # static: runs on any glibc
            archive: devstack-x86_64-unknown-linux-musl.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          # Only main writes the cache; tag runs read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: musl tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "v$crate" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml version $crate"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: build
        run: cargo build --release --locked -p devstack --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          mkdir -p dist
          if [ "${{ matrix.os }}" = windows-latest ]; then
            7z a -tzip "dist/${{ matrix.archive }}" "./$dir/devstack.exe" README.md
          else
            tar -czf "dist/${{ matrix.archive }}" -C "$dir" devstack -C "$GITHUB_WORKSPACE" README.md
          fi
          "$dir/devstack${{ matrix.os == 'windows-latest' && '.exe' || '' }}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: x86_64-*
          merge-multiple: true
      - name: checksums and install scripts
        run: |
          cp install.ps1 install.sh dist/
          (cd dist && sha256sum devstack-* > SHA256SUMS && cat SHA256SUMS)
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "devstack ${GITHUB_REF_NAME#v}" --generate-notes
