name: release

# A tag v<version> builds devstack for Windows, Linux (x86_64, arm64) and macOS
# (Apple Silicon, Intel; ADR-0054) and publishes a GitHub
# release with the archives, SHA256SUMS and the install scripts, and a build
# provenance attestation for each of them (`gh attestation verify <file>
# --repo nuetzliches/devstack`). Asset names carry no version, so
# ".../releases/latest/download/<asset>" stays stable.
#
# workflow_dispatch, the schedule and pull requests that change the release
# (this file, the installers) build the same archives without publishing (dry
# run). On main they also keep the release build cache warm: a tag run can
# read caches of main but not of another tag, and GitHub drops a cache unused
# for 7 days, hence twice a week.
#
# After the release, the Windows build goes to winget: job `winget` submits
# the manifests of packaging/winget/ as a pull request to
# microsoft/winget-pkgs (a dry run only renders and checks them). The macOS
# and Linux builds go to Homebrew: job `homebrew` installs and tests the
# formula of packaging/homebrew/ from the archives just built, on macOS and
# Linux; on a tag, job `homebrew-tap` pushes it to nuetzliches/homebrew-tap.
#
# Actions are pinned by commit SHA (the comment names the release);
# Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'install.ps1'
      - 'install.sh'
      - 'packaging/winget/**'
      - 'packaging/homebrew/**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1,4'

permissions:
  contents: read

jobs:
  ui:
    # The dashboard is the same for every target: build it once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: dashboard
        working-directory: ui
        run: npm ci && npm run build
      # What ships has no known advisory (a warning in ci, required here).
      - name: npm audit
        working-directory: ui
        run: npm audit --omit=dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist

  advisories:
    # No dependency with a known advisory goes into a release (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  build:
    needs: ui
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: devstack-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl   # static: runs on any glibc
            archive: devstack-x86_64-unknown-linux-musl.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: devstack-aarch64-unknown-linux-musl.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: devstack-aarch64-apple-darwin.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin         # built on Apple Silicon, not run there
            archive: devstack-x86_64-apple-darwin.tar.gz
            cross: true
    runs-on: ${{ matrix.os }}
    env:
      # The oldest macOS the build runs on (ADR-0054); ignored elsewhere.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          # Only main writes the cache; tag runs read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: musl tools
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: tag matches the crate and dashboard versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "v$crate" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml version $crate"; exit 1; }
          ui=$(grep -m1 '"version":' ui/package.json | cut -d'"' -f4)
          [ "v$ui" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != ui/package.json version $ui"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: build
        run: cargo build --release --locked -p devstack --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          mkdir -p dist
          if [ "${{ matrix.os }}" = windows-latest ]; then
            7z a -tzip "dist/${{ matrix.archive }}" "./$dir/devstack.exe" README.md
          else
            tar -czf "dist/${{ matrix.archive }}" -C "$dir" devstack -C "$GITHUB_WORKSPACE" README.md
          fi
          if [ "${{ matrix.cross }}" = true ]; then
            file "$dir/devstack"
          else
            "$dir/devstack${{ matrix.os == 'windows-latest' && '.exe' || '' }}" --version
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/${{ matrix.archive }}

  publish:
    needs: [build, advisories]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed attestation per file (Sigstore, OIDC).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only what reached main (through a pull request and its checks) is
      # released: a tag on any other commit stops here.
      - name: the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} ($GITHUB_SHA) is not on main"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: checksums and install scripts
        run: |
          cp install.ps1 install.sh dist/
          (cd dist && sha256sum devstack-* > SHA256SUMS && cat SHA256SUMS)
      - name: build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/devstack-*
            dist/SHA256SUMS
            dist/install.ps1
            dist/install.sh
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        # --verify-tag: only a tag that exists in the repository is released.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "devstack ${GITHUB_REF_NAME#v}" --generate-notes

  winget:
    # The manifests of packaging/winget/ with this release's version and the
    # checksum of the archive just built (render.ps1), checked, and on a tag
    # submitted to microsoft/winget-pkgs (submit.ps1, wingetcreate pinned by
    # version and checksum). Its review takes days; `winget upgrade` offers
    # the release once it is merged. The pull request comes from the fork of
    # winget-pkgs of the account whose token is the secret WINGET_TOKEN (a
    # classic token with `public_repo`); without the secret the job says so
    # and ends. While the package is not in the catalog and a pull request
    # for it is open, it does not add another one: the winget workflow
    # submits the version then current once the first is merged.
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-x86_64-pc-windows-msvc
          path: dist
      - name: manifests
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value }
          ./packaging/winget/render.ps1 -Version $version -Zip dist/devstack-x86_64-pc-windows-msvc.zip -Out "winget/$version" -Validate
          "MANIFESTS=winget/$version" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: submit
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: ./packaging/winget/submit.ps1 -Manifests $env:MANIFESTS -Version $env:VERSION

  homebrew:
    # The formula of packaging/homebrew/ with this release's version and the
    # checksums of the archives just built, installed from a local tap and
    # tested (`brew install`, `brew test`) where Homebrew users are: macOS on
    # Apple Silicon, Linux on x86_64 and arm64. The archives are served from
    # disk (file://), so this runs before anything is published.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Homebrew
        shell: bash
        run: |
          # On the Linux runners Homebrew is installed but not on PATH.
          if ! command -v brew >/dev/null; then
            if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
              brew=/home/linuxbrew/.linuxbrew/bin/brew
            else
              NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
              brew=/home/linuxbrew/.linuxbrew/bin/brew
            fi
            eval "$("$brew" shellenv)"
            echo "$(dirname "$brew")" >> "$GITHUB_PATH"
          fi
          brew --version
      - name: formula from the archives just built
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          brew tap-new --no-git devstack/local
          tap="$(brew --repository)/Library/Taps/devstack/homebrew-local"
          sh packaging/homebrew/render.sh "$version" dist "file://$PWD/dist" > "$tap/Formula/devstack.rb"
          brew style "$tap/Formula/devstack.rb"
      - name: install and test
        shell: bash
        run: |
          brew install devstack/local/devstack
          brew test devstack/local/devstack
          devstack --version
          # The copy on PATH is Homebrew's link into the Cellar, which
          # `devstack update` hands over to `brew upgrade` (ADR-0054).
          ls -l "$(command -v devstack)"
          brew uninstall devstack/local/devstack

  homebrew-tap:
    # On a tag, after the release is out: the formula with the release's own
    # URLs (each checked to answer) pushed to nuetzliches/homebrew-tap, so
    # `brew upgrade` offers it at once. The push uses the secret
    # HOMEBREW_TAP_TOKEN (a fine-grained token with contents: write on that
    # repository only); without the secret the job says so and ends.
    needs: [build, publish, homebrew]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh packaging/homebrew/render.sh "$version" dist > devstack.rb
          cat devstack.rb
          for url in $(sed -n 's/^ *url "\(.*\)"$/\1/p' devstack.rb); do
            curl -fsSIL -o /dev/null "$url" || { echo "::error::$url does not answer"; exit 1; }
          done
      - name: push to the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then echo "::warning::no HOMEBREW_TAP_TOKEN: the formula is not in the tap"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/nuetzliches/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp devstack.rb tap/Formula/devstack.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/devstack.rb
          if git diff --cached --quiet; then echo "the tap has this formula already"; exit 0; fi
          git commit -m "devstack ${GITHUB_REF_NAME#v}"
          git push origin HEAD
