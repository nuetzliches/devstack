name: ci

# Actions are pinned by commit SHA (the comment names the release);
# Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Line tables are enough for test backtraces; full debug info makes builds,
  # links (Windows above all) and the cache larger for nothing.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    # Which parts a push touches: docs alone need no Rust build, Rust alone no
    # dashboard build. Skills are compiled into the binary, so they count as Rust.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      ui: ${{ steps.f.outputs.ui }}
      scripts: ${{ steps.f.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'skills/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'install.ps1'
              - 'install.sh'
              - 'packaging/**'
              - 'site/**'
              - '.github/workflows/**'
              - '.github/dependabot.yml'

  ui:
    needs: changes
    # The Rust jobs test the hub with the real dashboard, so a Rust change
    # builds it too.
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.rust == 'true'
    # The dashboard: type check and production build (the hub embeds ui/dist).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: build
        working-directory: ui
        run: npm ci && npm run build
      # Advisories for what ships (the dashboard's runtime dependencies): a
      # warning here, required in the release workflow.
      - name: npm audit
        working-directory: ui
        continue-on-error: true
        run: npm audit --omit=dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 3

  check:
    needs: [changes, ui]
    if: needs.changes.outputs.rust == 'true'
    # Windows is a first-class target (ADR-0011): every job runs on both.
    # macOS is a preview (ADR-0054), checked here on Apple Silicon; its
    # runners have no Docker.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Spotlight indexes every file the tests write and takes most of the
      # runner's three cores: a node test then finds no free CPU to offer.
      - name: no Spotlight
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      # The dashboard the hub embeds: its tests run against the real build
      # (routing and caching depend on its index.html and assets/).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Opt-in tests are #[ignore]d; they run in their own steps and jobs.
      - name: test
        run: cargo test --workspace --locked --no-fail-fast
      # Linux runners have a Docker engine with Linux containers; Windows runners do not.
      - name: compose against Docker
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p devstack-compose --test docker -- --include-ignored
        env:
          DEVSTACK_DOCKER_TESTS: '1'
      - name: a lane's infrastructure on a node, start to purge
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p devstack-node --test lanerun -- --include-ignored
        env:
          DEVSTACK_DOCKER_TESTS: '1'
      # The binary the tests just built; `cargo run` would build it once more.
      - name: example stack files
        shell: bash
        run: |
          target/debug/devstack check -f examples/devstack.toml
          target/debug/devstack check -f examples/fixture-stack/devstack.toml
      - name: fixture stack compose groups
        if: matrix.os == 'ubuntu-latest'
        run: target/debug/devstack check --compose -f examples/fixture-stack/devstack.toml

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # The workspace builds with the `rust-version` it declares (Cargo.toml):
    # a newer language or library feature needs that line raised too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: echo "version=$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: check
        run: cargo check --workspace --all-targets --locked

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Licences and sources of every dependency (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources
      # A new advisory for an old dependency is a warning here; the release
      # workflow requires a clean `check advisories`.
      - name: advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: true
        with:
          command: check advisories

  integration:
    # The name stays `integration (<os>)`: the branch ruleset requires it.
    name: integration (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Black-box test of the daemon against the example stack (needs the .NET SDK).
    # Linux also runs the compose groups; Windows runners have no Linux containers.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # The Compose variants need Linux containers: not run, not "passed".
            skip: --skip lifecycle_with_compose --skip a_lane_has_its_own_containers --skip an_announced_port_moves_inside_a_lanes_container --skip a_profile_leaves_out_containers
          - os: ubuntu-latest
            skip: ''
          # No Docker on the macOS runners (ADR-0054).
          - os: macos-14
            skip: --skip lifecycle_with_compose --skip a_lane_has_its_own_containers --skip an_announced_port_moves_inside_a_lanes_container --skip a_profile_leaves_out_containers
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # As in `check`: Spotlight would index every copy the tests make.
      - name: no Spotlight
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # The fixture's NuGet packages: every test copies the fixture and restores it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('examples/fixture-stack/**/*.csproj') }}
      # The .NET CLI's first run (its sentinel, NuGet's migrations) once,
      # before the tests start many builds at the same time: run at once,
      # the migrations race for their shared-memory directory and a build
      # fails (`mkdirat … .dotnet/shm/session…: ENOENT`). In a copy, so the
      # fixture the tests copy has no build output.
      - name: prime the .NET CLI
        shell: bash
        run: |
          cp -r examples/fixture-stack/src/Api "$RUNNER_TEMP/prime-api"
          dotnet build "$RUNNER_TEMP/prime-api/Api.csproj" -nologo -v q
      - name: daemon lifecycle
        shell: bash
        run: cargo test --locked -p devstack --test daemon_lifecycle -- --include-ignored --nocapture ${{ matrix.skip }}
        env:
          DEVSTACK_INTEGRATION: '1'
          DEVSTACK_INTEGRATION_COMPOSE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  remote-lane:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # A lane on a node of the pool (ADR-0025): coordinator, node agent and
    # requester on one Linux runner, the fixture's lane in its .NET SDK image.
    # The lane container mounts a static build, as a node does.
    runs-on: ubuntu-latest
    # A run takes four minutes; one that hangs ends here, not after six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: static build for the lane container
        run: cargo build --release --locked -p devstack --target x86_64-unknown-linux-musl
      - name: lane on a node
        run: cargo test --locked -p devstack --test remote_lane -- --include-ignored --nocapture
        env:
          DEVSTACK_INTEGRATION_NODE: '1'
          DEVSTACK_LANE_BIN: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/devstack

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    # The installers run on users' machines before anything else of devstack:
    # lint them on every change (shellcheck is on the runner image).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck install.sh
        run: shellcheck install.sh
      - name: install.sh syntax (dash)
        run: sh -n install.sh
      # The landing page's Content-Security-Policy allows its one inline
      # script by hash: an edit of the script needs the new hash.
      - name: site script hash
        shell: python
        run: |
          import base64, hashlib, re
          s = open('site/index.html', encoding='utf-8', newline='').read()
          script = re.search(r'<script>(.*?)</script>', s, re.S).group(1)
          h = base64.b64encode(hashlib.sha256(script.encode('utf-8')).digest()).decode()
          if f"script-src 'sha256-{h}'" not in s:
              raise SystemExit(f"site/index.html: set script-src 'sha256-{h}' in its Content-Security-Policy")

  scripts-windows:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Windows PowerShell 5.1 is what `irm | iex` runs in on a fresh machine.
      - name: install.ps1 and the winget scripts parse (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in @('install.ps1') + (Get-ChildItem packaging/winget -Filter *.ps1 | ForEach-Object { $_.FullName })) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error "${f}: $($_.Message)" -ErrorAction Continue }; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: PSScriptAnalyzer install.ps1 and the winget scripts
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $found = @('install.ps1', 'packaging/winget/render.ps1', 'packaging/winget/submit.ps1') | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error }
          $found | Format-Table -AutoSize
          if ($found) { exit 1 }
