# cargo-deny (CI job `deny`): dependencies keep to permissive licences
# (AGENTS.md: MIT-compatible only) and come from crates.io.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace crates depend on each other by path (not published).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# `check advisories` is a warning in CI (a new advisory for an old dependency
# should not turn every push red) and required in the release workflow: no
# release ships a dependency with a known advisory.
yanked = "warn"
ignore = [
    # zbus 5's `zvariant`, `zvariant_derive` and `zbus_names` are
    # unmaintained since they went into zbus 6 (no vulnerability). Only the
    # Linux keychain pulls them in: keyring 4.2 -> secret-service 5.2 ->
    # zbus 5 (ADR-0069); removed once keyring moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained, via keyring's secret-service; no zbus 6 release of it yet" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained, via keyring's secret-service; no zbus 6 release of it yet" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained, via keyring's secret-service; no zbus 6 release of it yet" },
]
