[package]
name = "devstack-desktop"
description = "The desktop devstack runs on, one module per operating system: the hub at logon, the devstack:// link, notifications, the folder dialog, browsers and programs, starting Docker, how devstack was installed (ADR-0054)"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
devstack-proc.workspace = true
raw-window-handle.workspace = true
rfd.workspace = true
windows.workspace = true
windows-sys.workspace = true

# The folder dialog through the XDG portal. Not on macOS: rfd would use
# AppKit, which wants the main thread; the hub asks from a worker thread and
# uses osascript there.
[target.'cfg(target_os = "linux")'.dependencies]
rfd.workspace = true
tokio-stream.workspace = true
zbus.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
