# Frozen for 0.8.0: lanes with their own infrastructure (`shared`), a service
# kept in the main tree (`lanes = false`).
version = 1

[stack]
name = "shop"
requires = "0.8.0"

[lanes]
port_step = 100

[compose.app]
project = "shop"
files = ["deploy/compose.yml"]
services = ["db", "mailbox"]
shared = ["mailbox"]

[services.api]
build = "dotnet build src/Api/Api.csproj -c Debug"
output = "src/Api/bin/Debug/net10.0"
run = "dotnet {artifact}/Api.dll"
port = 5000
after = ["compose.app.db"]

[services.tray]
kind = "tool"
run = "tray.exe"
lanes = false
